[package]
name = "metricrb/skilltree"
version = "1.0.0"
description = "A reusable, declarative skill tree system for Roblox games with support for multiple tree topologies, multi-rank upgrades, exclusive choices, and flexible prerequisites."
authors = ["metricrb"]
license = "MIT"
realm = "server"
registry = "https://github.com/UpliftGames/wally-index"

# `example/` and `tests/` are for this repo only (Rojo + Studio). They are not part of `wally install` / Registry tarballs.
exclude = ["tests", "example", "docs"]

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3"

# Fusion for the Fusion example only (`example/`); not transitive for Registry consumers ([dev-dependencies]).
[dev-dependencies]
Fusion = "elttob/fusion@0.3.0"
