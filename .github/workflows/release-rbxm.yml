# Attach a Rojo-built place/model file to each GitHub Release (e.g. tag v1.0.0).
name: Release Rojo asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  rbxm:
    name: Build and upload SkillTree.rbxm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Prebuilt Rojo/Wally Linux binaries link OpenSSL 1.1; ubuntu-latest (24.04) only ships 3.x.
      - name: Install OpenSSL 1.1 for Aftman CLI tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          wget -qO /tmp/libssl1.1.deb \
            http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          sudo apt-get install -y /tmp/libssl1.1.deb

      - name: Install Aftman tools (Rojo, Wally)
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v0.3.0

      - name: Wally install
        run: wally install

      - name: Rojo build
        run: rojo build default.project.json -o SkillTree.rbxm

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: SkillTree.rbxm
