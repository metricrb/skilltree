# Validates manifest, resolves Wally deps, and ensures the Rojo project builds.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LPGhatguy/setup-aftman was removed; ok-nick/setup-aftman installs from aftman.toml.
      - name: Install Aftman tools (Rojo, Wally)
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v0.3.0

      - name: Wally install
        run: wally install

      - name: Wally package — list published files
        run: wally package --list

      - name: Rojo build
        run: rojo build default.project.json -o /tmp/skilltree-ci.rbxl

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Moonwave build (docs)
        run: npx --yes moonwave@latest build
